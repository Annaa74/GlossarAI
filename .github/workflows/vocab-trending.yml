name: Weekly trending vocab

on:
  schedule:
    # Mondays at 14:00 UTC (= 19:30 IST, 06:00 PT). Cron uses UTC.
    - cron: '0 14 * * 1'
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate trending candidates
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: claude-opus-4-7
          MAX_NEW_TERMS: 8
        run: node scripts/generate-trending-vocab.mjs

      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet vocab.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open pull request with new candidates
        if: steps.changes.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: vocab-trending/${{ github.run_id }}
          delete-branch: true
          commit-message: 'chore(vocab): weekly AI-curated candidates'
          title: 'Weekly trending vocab candidates'
          body: |
            Auto-generated by `.github/workflows/vocab-trending.yml`.

            Each candidate has `approved: false` — review the diff, edit any
            definitions you don't like, flip `approved` to `true` for the ones
            you want shipped, and **bump `version`** in `vocab.json`. Merging
            this PR alone does NOT publish to users; only a `version` bump does.

            Source signals: Hacker News top 30, ArXiv cs.AI top 20.
          labels: vocab,automated
